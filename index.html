<style>
@property --ra-beam-angle { syntax:"<angle>"; initial-value:0deg; inherits:false; }

:root{
  --black:#191917; --linen:#F4EFE5; --sage:#788F76; --stone:#BFB19C; --stone-dark:#8C7F6A;
  --cream-soft:#EDE7D8; --moss:#222B1C; --glow:#B9C8AE;
  --line:rgba(25,25,23,.12);
  --ease:cubic-bezier(.16,1,.3,1);
  --shadow:0 24px 60px -22px rgba(25,30,20,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--linen); color:var(--black);
  font-family:'DM Sans',system-ui,sans-serif; font-weight:300; font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; height:100dvh; overflow:hidden;
}
img,svg{display:block; max-width:100%}
a{color:inherit; text-decoration:none}
:focus-visible{outline:2px solid var(--sage); outline-offset:3px}

/* fondo: geometría sagrada muy tenue */
.ra-ambient{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.ra-ambient svg{position:absolute; right:-14vh; top:50%; transform:translateY(-50%); width:min(120vh,1100px); height:auto; opacity:.5}
.ra-ambient .c{fill:none; stroke:var(--sage); stroke-width:.7; opacity:.4}
.ra-ambient .c2{stroke:var(--stone); opacity:.35}

/* ── orbe vivo (identidad) ─────────────────────────────────────────── */
.ra-orb{position:relative; display:grid; place-items:center; isolation:isolate}
.ra-orb__halo{position:absolute; inset:-14%; border-radius:50%; z-index:0; pointer-events:none;
  background:radial-gradient(circle,var(--sage) 0%, rgba(120,143,118,0) 65%);
  filter:blur(calc(var(--ra-size)*.18)); opacity:.4; animation:ra-breathe 3.6s ease-in-out infinite;}
.ra-orb__beam{position:absolute; inset:0; border-radius:50%; padding:var(--ra-beam,2px); pointer-events:none; z-index:2;
  background:conic-gradient(from var(--ra-beam-angle), transparent 0deg, transparent 190deg,
    rgba(185,200,174,0) 235deg, var(--glow) 300deg, var(--sage) 335deg, transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; animation:ra-spin 3.9s linear infinite;}
.ra-orb__core{position:relative; width:var(--ra-size); height:var(--ra-size); border-radius:50%; overflow:hidden; z-index:1;
  background:radial-gradient(120% 120% at 30% 25%, var(--cream-soft), #D8DCC7 70%);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.6), inset 0 -8px 16px rgba(34,43,28,.22);}
.ra-blob{position:absolute; border-radius:50%; filter:blur(var(--ra-blur,7px)); mix-blend-mode:multiply; opacity:.85}
.ra-blob.b1{width:66%; height:66%; left:-6%; top:3%;    background:radial-gradient(circle,var(--sage),transparent 70%);  animation:ra-d1 6.5s ease-in-out infinite}
.ra-blob.b2{width:58%; height:58%; right:-9%; top:12%;   background:radial-gradient(circle,var(--moss),transparent 70%);  animation:ra-d2 7.8s ease-in-out infinite}
.ra-blob.b3{width:56%; height:56%; left:14%; bottom:-9%; background:radial-gradient(circle,var(--glow),transparent 68%);  animation:ra-d3 5.6s ease-in-out infinite; mix-blend-mode:screen; opacity:.9}
.ra-orb__gloss{position:absolute; inset:0; border-radius:50%; pointer-events:none;
  background:radial-gradient(60% 45% at 34% 26%, rgba(255,255,255,.72), transparent 60%);}
.ra-orb--sm{--ra-size:34px; --ra-beam:1.6px; --ra-blur:4px}
.ra-orb--lg{--ra-size:128px; --ra-beam:2.5px; --ra-blur:11px}

body.is-busy .ra-orb__beam{animation-duration:1.4s}
body.is-busy .ra-orb__halo{animation-duration:1.6s; opacity:.55}
body.is-busy .ra-blob{animation-duration:2.6s !important}

/* ── topbar ────────────────────────────────────────────────────────── */
.ra-top{position:relative; z-index:3; display:flex; align-items:center; gap:14px;
  padding:16px clamp(16px,4vw,40px); border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(244,239,229,.9), rgba(244,239,229,.72)); backdrop-filter:blur(10px);}
.ra-brand{display:flex; align-items:center; gap:12px; min-width:0}
.ra-brand__txt .ra-eyebrow{font-weight:500; font-size:9.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--stone-dark); margin:0}
.ra-brand__txt .ra-word{font-family:'Bodoni Moda',serif; font-weight:400; font-size:22px; letter-spacing:.14em; text-transform:uppercase; line-height:1; margin:1px 0 0}
.ra-top__spacer{flex:1 1 auto}
.ra-top__link{font-weight:500; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--stone-dark); padding:8px 10px; border-radius:9px; transition:color .2s, background .2s}
.ra-top__link:hover{color:var(--black); background:rgba(34,43,28,.06)}
.ra-top__link[hidden]{display:none}

/* ── zona de conversación (scroll) ─────────────────────────────────── */
.ra-stage{position:relative; z-index:1; flex:1 1 auto; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--sage) transparent;}
.ra-stage::-webkit-scrollbar{width:7px}
.ra-stage::-webkit-scrollbar-thumb{background:rgba(120,143,118,.45); border-radius:7px}
.ra-inner{max-width:720px; margin:0 auto; padding:clamp(24px,5vh,64px) clamp(16px,4vw,32px) 24px; min-height:100%; display:flex; flex-direction:column}

/* hero / estado inicial */
.ra-hero{margin:auto; text-align:center; display:flex; flex-direction:column; align-items:center; gap:0;
  transition:opacity .4s ease, transform .4s ease}
.ra-hero.gone{opacity:0; transform:translateY(-10px); pointer-events:none; height:0; margin:0; overflow:hidden}
.ra-hero .ra-orb--lg{margin-bottom:26px}
.ra-tagline{font-family:'Cormorant',serif; font-style:italic; font-weight:400; font-size:clamp(24px,4vw,32px); color:var(--moss); margin:0 0 14px; line-height:1.2}
.ra-greet{font-size:15.5px; line-height:1.65; color:var(--stone-dark); max-width:440px; margin:0 auto 28px}
.ra-chips{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:560px}
.ra-chip{font-family:inherit; font-size:13px; color:var(--moss); background:rgba(255,255,255,.6); border:1px solid var(--line);
  border-radius:100px; padding:9px 16px; cursor:pointer; transition:background .2s, border-color .2s, transform .15s}
.ra-chip:hover{background:#fff; border-color:var(--sage); transform:translateY(-1px)}

/* mensajes */
.ra-log{display:flex; flex-direction:column; gap:18px}
.ra-msg{display:flex; gap:12px; max-width:82%; animation:ra-rise .34s ease both}
.ra-msg.user{align-self:flex-end; flex-direction:row-reverse}
.ra-avatar{flex:0 0 auto; margin-top:2px}
.ra-msg.user .ra-avatar{display:none}
.ra-bubble{font-size:15px; line-height:1.6; padding:12px 16px; border-radius:18px; word-wrap:break-word}
.ra-msg.bot .ra-bubble{background:var(--cream-soft); border:1px solid var(--line); border-top-left-radius:6px; color:var(--black)}
.ra-msg.user .ra-bubble{background:var(--moss); color:var(--linen); border-bottom-right-radius:6px}
.ra-bubble img{max-width:240px; border-radius:12px; margin-top:6px; display:block}
.ra-typing{display:flex; gap:5px; padding:5px 2px}
.ra-typing span{width:7px; height:7px; border-radius:50%; background:var(--sage); animation:ra-blink 1.3s ease-in-out infinite}
.ra-typing span:nth-child(2){animation-delay:.18s}
.ra-typing span:nth-child(3){animation-delay:.36s}

/* ── composer ──────────────────────────────────────────────────────── */
.ra-dock{position:relative; z-index:3; padding:14px clamp(16px,4vw,32px) calc(16px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line); background:linear-gradient(0deg, var(--cream-soft), rgba(244,239,229,.85)); backdrop-filter:blur(10px)}
.ra-dock__inner{max-width:720px; margin:0 auto}
.ra-attach{display:none; align-items:center; gap:10px; margin-bottom:8px; padding:8px 10px;
  background:#fff; border:1px solid var(--line); border-radius:12px; font-size:12px; color:var(--stone-dark)}
.ra-attach.show{display:flex}
.ra-attach img{width:36px; height:36px; object-fit:cover; border-radius:8px}
.ra-attach button{margin-left:auto; border:0; background:transparent; cursor:pointer; color:var(--stone-dark); font-size:17px; line-height:1}

.ra-composer{position:relative; border-radius:20px}
.ra-composer__beam{position:absolute; inset:0; border-radius:20px; padding:1.5px; pointer-events:none; z-index:2; opacity:.55;
  background:conic-gradient(from var(--ra-beam-angle), transparent 0deg, transparent 215deg, var(--glow) 300deg, var(--sage) 340deg, transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; animation:ra-spin 6s linear infinite}
body.is-busy .ra-composer__beam{animation-duration:1.6s; opacity:.8}
.ra-inputrow{position:relative; z-index:1; display:flex; align-items:flex-end; gap:8px;
  background:#fff; border:1px solid var(--line); border-radius:20px; padding:8px 8px 8px 18px;
  transition:border-color .2s, box-shadow .2s}
.ra-inputrow:focus-within{border-color:var(--sage); box-shadow:0 0 0 3px rgba(120,143,118,.15)}
.ra-field{flex:1 1 auto; border:0; outline:0; resize:none; background:transparent; font-family:inherit; font-weight:400;
  font-size:15.5px; line-height:1.5; color:var(--black); max-height:140px; padding:7px 0; min-height:26px}
.ra-field::placeholder{color:var(--stone-dark); opacity:.75}
.ra-icon{flex:0 0 auto; width:40px; height:40px; border:0; border-radius:50%; cursor:pointer; background:transparent;
  color:var(--stone-dark); display:grid; place-items:center; transition:background .2s, color .2s}
.ra-icon:hover{background:rgba(120,143,118,.15); color:var(--moss)}
.ra-icon svg{width:20px; height:20px}
.ra-send{background:var(--moss); color:var(--linen)}
.ra-send:hover{background:var(--sage); color:#fff}
.ra-mic.recording{background:var(--moss); color:var(--linen); animation:ra-pulse 1.1s ease-in-out infinite}

.ra-opts{display:flex; align-items:center; justify-content:space-between; margin-top:11px; padding:0 6px}
.ra-voice{display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none}
.ra-voice > span:last-child{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--stone-dark)}
.ra-switch{position:relative; width:40px; height:22px; border-radius:11px; background:rgba(34,43,28,.22); transition:background .25s}
.ra-switch::after{content:""; position:absolute; top:2.5px; left:2.5px; width:17px; height:17px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .25s}
.ra-voice input{position:absolute; opacity:0; width:0; height:0}
.ra-voice input:checked + .ra-switch{background:var(--sage)}
.ra-voice input:checked + .ra-switch::after{transform:translateX(18px)}
.ra-hint{font-size:11px; color:var(--sage); letter-spacing:.02em; opacity:0; transition:opacity .2s}
.ra-hint.show{opacity:1}

/* keyframes */
@keyframes ra-spin{to{--ra-beam-angle:360deg}}
@keyframes ra-breathe{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.16);opacity:.58}}
@keyframes ra-d1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(9%,7%) scale(1.12)}}
@keyframes ra-d2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-8%,6%) scale(1.15)}}
@keyframes ra-d3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(5%,-9%) scale(1.1)}}
@keyframes ra-rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes ra-blink{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes ra-pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,43,28,.4)}50%{box-shadow:0 0 0 8px rgba(34,43,28,0)}}

@media (max-width:560px){
  .ra-brand__txt .ra-word{font-size:19px}
  .ra-orb--lg{--ra-size:104px}
  .ra-msg{max-width:90%}
}
@media (prefers-reduced-motion:reduce){
  .ra-orb__beam,.ra-orb__halo,.ra-blob,.ra-composer__beam,.ra-mic.recording,.ra-typing span{animation:none}
  .ra-hero{transition:none}
}
</style>
</head>
<body>

<div class="ra-ambient" aria-hidden="true">
  <svg viewBox="0 0 600 600" fill="none">
    <circle class="c"  cx="300" cy="180" r="150"/>
    <circle class="c"  cx="300" cy="300" r="220"/>
    <circle class="c2" cx="300" cy="300" r="290"/>
    <circle class="c"  cx="300" cy="420" r="150"/>
    <circle class="c2" cx="300" cy="250" r="95"/>
    <line class="c2" x1="300" y1="10" x2="300" y2="590"/>
  </svg>
</div>

<header class="ra-top">
  <div class="ra-brand">
    <div class="ra-orb ra-orb--sm" aria-hidden="true">
      <span class="ra-orb__halo"></span><span class="ra-orb__beam"></span>
      <span class="ra-orb__core"><span class="ra-blob b1"></span><span class="ra-blob b2"></span><span class="ra-blob b3"></span><span class="ra-orb__gloss"></span></span>
    </div>
    <div class="ra-brand__txt">
      <p class="ra-eyebrow">Asistente de bienestar</p>
      <p class="ra-word">Regen</p>
    </div>
  </div>
  <div class="ra-top__spacer"></div>
  <button class="ra-top__link" type="button" data-reset hidden>Nueva conversación</button>
  <a class="ra-top__link" href="https://regen.ar">← regen.ar</a>
</header>

<main class="ra-stage">
  <div class="ra-inner">

    <div class="ra-hero" data-hero>
      <div class="ra-orb ra-orb--lg" aria-hidden="true">
        <span class="ra-orb__halo"></span><span class="ra-orb__beam"></span>
        <span class="ra-orb__core"><span class="ra-blob b1"></span><span class="ra-blob b2"></span><span class="ra-blob b3"></span><span class="ra-orb__gloss"></span></span>
      </div>
      <p class="ra-tagline">Optimizando la vitalidad humana</p>
      <p class="ra-greet">Hola. Soy el asistente de REGEN, el primer centro de bienestar biológico de Córdoba. Preguntame lo que quieras — podés escribirme, mandarme un audio o una imagen.</p>
      <div class="ra-chips" data-chips>
        <button class="ra-chip" type="button">¿Qué es un centro de bienestar biológico?</button>
        <button class="ra-chip" type="button">¿Cómo miden mi biología?</button>
        <button class="ra-chip" type="button">¿Qué es la medicina de longevidad?</button>
        <button class="ra-chip" type="button">Quiero saber sobre turnos</button>
      </div>
    </div>

    <div class="ra-log" data-log role="log" aria-live="polite"></div>
  </div>
</main>

<div class="ra-dock">
  <div class="ra-dock__inner">
    <div class="ra-attach" data-attach>
      <img data-attach-img alt="Imagen a enviar">
      <span data-attach-name>imagen.jpg</span>
      <button type="button" data-attach-remove aria-label="Quitar imagen">&times;</button>
    </div>

    <div class="ra-composer">
      <div class="ra-composer__beam" aria-hidden="true"></div>
      <div class="ra-inputrow">
        <textarea class="ra-field" data-field rows="1" placeholder="Escribí tu consulta…" aria-label="Mensaje"></textarea>
        <button class="ra-icon ra-img" type="button" data-img aria-label="Adjuntar imagen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l4.5-4.5L13 17l3-3 4 4"/></svg>
        </button>
        <input type="file" accept="image/*" data-file hidden>
        <button class="ra-icon ra-mic" type="button" data-mic aria-label="Grabar audio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="ra-icon ra-send" type="button" data-send aria-label="Enviar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>

    <div class="ra-opts">
      <label class="ra-voice">
        <input type="checkbox" data-voice checked>
        <span class="ra-switch" aria-hidden="true"></span>
        <span>Responder en voz</span>
      </label>
      <span class="ra-hint" data-hint></span>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  /* ═══════════════ CONFIG (mismo Worker que ya usás) ═══════════════ */
  var WORKER_URL = "https://regen-agente.sebagaviglio.workers.dev";
  var AUDIO_MIME = "audio/mp3";
  var STRIP_DATA_PREFIX = true;
  /* ════════════════════════════════════════════════════════════════ */

  var body   = document.body;
  var stage  = document.querySelector(".ra-stage");
  var hero   = document.querySelector("[data-hero]");
  var log    = document.querySelector("[data-log]");
  var chips  = document.querySelector("[data-chips]");
  var field  = document.querySelector("[data-field]");
  var sendB  = document.querySelector("[data-send]");
  var micB   = document.querySelector("[data-mic]");
  var imgB   = document.querySelector("[data-img]");
  var fileIn = document.querySelector("[data-file]");
  var voiceI = document.querySelector("[data-voice]");
  var hint   = document.querySelector("[data-hint]");
  var resetB = document.querySelector("[data-reset]");
  var attach = document.querySelector("[data-attach]");
  var attachImg  = document.querySelector("[data-attach-img]");
  var attachName = document.querySelector("[data-attach-name]");
  var attachRm   = document.querySelector("[data-attach-remove]");

  function newSession(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now()+"-"+Math.random()); }
  var sessionId = newSession();
  var pendingImage = null, mediaRecorder = null, chunks = [], recording = false, busy = false, started = false;

  function setBusy(v){ busy = v; body.classList.toggle("is-busy", v); }
  function showHint(t){ hint.textContent = t||""; hint.classList.toggle("show", !!t); }

  function startConversation(){
    if(started) return; started = true;
    hero.classList.add("gone");
    resetB.hidden = false;
  }
  resetB.addEventListener("click", function(){
    sessionId = newSession();
    log.innerHTML = ""; started = false; hero.classList.remove("gone"); resetB.hidden = true;
    clearAttachment(); field.value=""; autoGrow(); field.focus();
  });

  function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
  var avatar = '<span class="ra-avatar ra-orb ra-orb--sm" aria-hidden="true"><span class="ra-orb__core"><span class="ra-blob b1"></span><span class="ra-blob b2"></span><span class="ra-blob b3"></span><span class="ra-orb__gloss"></span></span></span>';

  function addMsg(role, text, imgUrl){
    startConversation();
    var m = document.createElement("div");
    m.className = "ra-msg " + (role==="user" ? "user" : "bot");
    var inner = role!=="user" ? avatar : "";
    var bubble = "";
    if(text)   bubble += esc(text).replace(/\n/g,"<br>");
    if(imgUrl) bubble += '<img src="'+imgUrl+'" alt="Imagen enviada">';
    inner += '<div class="ra-bubble">'+bubble+'</div>';
    m.innerHTML = inner;
    log.appendChild(m); stage.scrollTop = stage.scrollHeight;
    return m;
  }
  function addTyping(){
    startConversation();
    var m = document.createElement("div");
    m.className = "ra-msg bot";
    m.innerHTML = avatar + '<div class="ra-bubble"><div class="ra-typing"><span></span><span></span><span></span></div></div>';
    log.appendChild(m); stage.scrollTop = stage.scrollHeight;
    return m;
  }

  function blobToDataUrl(blob){ return new Promise(function(res,rej){ var r=new FileReader(); r.onloadend=function(){res(String(r.result));}; r.onerror=rej; r.readAsDataURL(blob); }); }
  function payloadFrom(u){ return STRIP_DATA_PREFIX ? u.split(",")[1] : u; }

  function callWorker(o){
    var b = { sessionId: sessionId, wantVoice: voiceI.checked };
    if(typeof o.text === "string") b.text = o.text;
    if(o.audioBase64) b.audioBase64 = o.audioBase64;
    if(o.imageBase64){ b.imageBase64 = o.imageBase64; if(o.imageMediaType) b.imageMediaType = o.imageMediaType; }
    return fetch(WORKER_URL, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(b) })
      .then(function(res){ if(!res.ok) throw new Error("HTTP "+res.status); return res.json(); });
  }
  function playVoice(b64){ if(!b64) return; try{ new Audio("data:"+AUDIO_MIME+";base64,"+b64).play().catch(function(){}); }catch(e){} }

  function handleSend(o){
    if(busy) return;
    addMsg("user", o.showText || o.text || (o.audioBase64 ? "🎤 Audio" : ""), o.imageDataUrl || null);
    field.value = ""; autoGrow(); clearAttachment(); setBusy(true);
    var typing = addTyping();
    callWorker({ text:o.text, audioBase64:o.audioBase64, imageBase64:o.imageBase64, imageMediaType:o.imageMediaType })
      .then(function(data){
        typing.remove();
        addMsg("bot", (data && (data.reply || data.error)) || "Sin respuesta.");
        if(voiceI.checked && data && data.audioBase64) playVoice(data.audioBase64);
      })
      .catch(function(err){ typing.remove(); addMsg("bot","No pude conectar. Probá de nuevo en un momento."); console.error("[REGEN]", err); })
      .then(function(){ setBusy(false); });
  }

  function submitText(){
    var text = field.value.trim();
    if(!text && !pendingImage) return;
    handleSend({
      text: text || (pendingImage ? "" : undefined),
      imageDataUrl: pendingImage ? pendingImage.dataUrl : null,
      imageBase64:  pendingImage ? pendingImage.base64 : undefined,
      imageMediaType: pendingImage ? pendingImage.mediaType : undefined,
      showText: text
    });
  }
  sendB.addEventListener("click", submitText);
  field.addEventListener("keydown", function(e){ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); submitText(); } });

  chips.addEventListener("click", function(e){
    var b = e.target.closest(".ra-chip"); if(!b) return;
    handleSend({ text: b.textContent, showText: b.textContent });
  });

  function autoGrow(){ field.style.height="auto"; field.style.height=Math.min(field.scrollHeight,140)+"px"; }
  field.addEventListener("input", autoGrow);

  imgB.addEventListener("click", function(){ fileIn.click(); });
  fileIn.addEventListener("change", function(){
    var f = fileIn.files && fileIn.files[0]; if(!f) return;
    blobToDataUrl(f).then(function(u){
      pendingImage = { dataUrl:u, base64:payloadFrom(u), mediaType:f.type, name:f.name };
      attachImg.src = u; attachName.textContent = f.name; attach.classList.add("show");
      fileIn.value = ""; field.focus();
    });
  });
  function clearAttachment(){ pendingImage=null; attach.classList.remove("show"); attachImg.removeAttribute("src"); }
  attachRm.addEventListener("click", clearAttachment);

  micB.addEventListener("click", function(){
    if(recording){ stopRecording(); return; }
    if(!navigator.mediaDevices || !window.MediaRecorder){ addMsg("bot","Tu navegador no permite grabar audio. Probá desde otro dispositivo o escribí tu consulta."); return; }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      chunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = function(e){ if(e.data.size) chunks.push(e.data); };
      mediaRecorder.onstop = function(){
        stream.getTracks().forEach(function(t){ t.stop(); });
        var blob = new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" });
        blobToDataUrl(blob).then(function(u){ handleSend({ audioBase64: payloadFrom(u), showText:"🎤 Audio" }); });
      };
      mediaRecorder.start(); recording = true;
      micB.classList.add("recording"); micB.setAttribute("aria-label","Detener y enviar audio");
      setBusy(true); showHint("Grabando… tocá para enviar");
    }).catch(function(err){ showHint(""); addMsg("bot","No pude acceder al micrófono. Revisá los permisos del navegador."); console.error("[REGEN] mic:", err); });
  });
  function stopRecording(){
    if(mediaRecorder && recording){ mediaRecorder.stop(); }
    recording = false; micB.classList.remove("recording"); micB.setAttribute("aria-label","Grabar audio");
    setBusy(false); showHint("");
  }

  field.focus();
})();
</script>
</body>
</html>
